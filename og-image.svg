  <rect x="72" y="527" width="1056" height="1" fill="url(#accent)" opacity="0.65"/>
  <text x="72" y="572" fill="#7f8ba1" font-family="Arial, sans-serif" font-size="20">sanjeet-biswas.github.io/portfolio</text>
  <text x="1128" y="572" text-anchor="end" fill="#7f8ba1" font-family="Arial, sans-serif" font-size="20">Bangalore, India</text>
